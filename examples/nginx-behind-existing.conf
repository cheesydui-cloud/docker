# 如果占用 80/443 的是 Nginx / 3x-ui 自带 Nginx，加这个 server。
# 证书路径按你现有站点改，或继续用现有面板申请 docker.nodelink.uk 的证书。

server {
    listen 80;
    listen [::]:80;
    server_name docker.nodelink.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docker.nodelink.uk;

    # 换成你的证书路径（3x-ui / acme.sh 签发后的位置）
    ssl_certificate     /root/cert/docker.nodelink.uk/fullchain.pem;
    ssl_certificate_key /root/cert/docker.nodelink.uk/privkey.pem;

    client_max_body_size 0;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5080;
    }
}
