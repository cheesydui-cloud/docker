<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>镜像加速站控制台</title>
  <style>
    :root {
      --bg: #f4efe8;
      --sidebar: #fbf8f4;
      --card: #fffdf9;
      --line: #eadfd3;
      --text: #2c241c;
      --muted: #7a7066;
      --accent: #b56a3c;
      --accent-soft: #efe0d2;
      --ok: #2f7d4a;
      --bad: #b42318;
      --warn: #9a6700;
      --shadow: 0 10px 30px rgba(80, 52, 28, .06);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .shell { min-height: 100%; display: flex; }
    .sidebar {
      width: 232px;
      flex: 0 0 232px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
    }
    .brand { padding: 6px 12px 22px; }
    .brand b { display: block; font-size: 16px; letter-spacing: .02em; }
    .brand span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .nav-label {
      margin: 16px 12px 8px;
      color: #9a8f84;
      font-size: 12px;
    }
    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .nav-btn svg { width: 18px; height: 18px; flex: 0 0 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .nav-btn:hover { background: #f3ebe2; }
    .nav-btn.active { background: var(--accent-soft); color: #6a3d20; font-weight: 600; }
    .sidebar-foot { margin-top: auto; padding: 14px 12px 4px; color: var(--muted); font-size: 12px; }

    .main { flex: 1; min-width: 0; padding: 22px 28px 48px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }
    .topbar h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.03em; }
    .who {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 8px 6px 14px;
      box-shadow: var(--shadow);
    }
    .who b { font-weight: 600; }

    .page { display: none; }
    .page.active { display: block; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .stat { padding: 18px 20px; border-right: 1px solid var(--line); }
    .stat:last-child { border-right: 0; }
    .stat b { display: block; color: var(--muted); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .stat strong { display: block; font-size: 22px; letter-spacing: -.03em; word-break: break-all; }
    .stat em { display: block; margin-top: 6px; color: var(--muted); font-style: normal; font-size: 12px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 22px;
      margin-bottom: 14px;
    }
    .card h2 { margin: 0 0 16px; font-size: 16px; }
    .flash { min-height: 0; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin-bottom: 14px; }
    label { display: block; margin: 0 0 6px; color: #4d443c; font-size: 13px; }
    input, select {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #e2d6c8;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus { outline: 2px solid #e8c9ae; border-color: var(--accent); }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid #e2d6c8;
      background: #fff;
      color: var(--text);
    }
    .btn:hover { background: #f7efe6; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.primary { background: #2c241c; color: #fff; border-color: #2c241c; }
    .btn.primary:hover { background: #44372c; }
    .btn.danger { color: var(--bad); border-color: #efc4c0; background: #fff; }
    .check { display: flex; align-items: center; gap: 8px; margin: 2px 0 14px; color: #4d443c; }
    .check input { width: auto; height: auto; }
    pre {
      margin: 0;
      background: #faf6f1;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      overflow: auto;
      min-height: 180px;
      white-space: pre-wrap;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    .flash { margin: 12px 0 0; }
    .toast {
      position: fixed;
      right: 24px;
      top: 20px;
      z-index: 20;
      min-width: 220px;
      max-width: 420px;
      background: #2c241c;
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      display: none;
    }
    .toast.show { display: block; }
    .toast.bad { background: #8b2a22; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; background: #faf6f1; }
    tr:last-child td { border-bottom: 0; }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: #bbb;
    }
    .dot.up { background: var(--ok); }
    .dot.down { background: var(--bad); }
    .split { height: 1px; background: var(--line); margin: 22px 0; }

    .login-wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 28px 28px 24px;
    }
    .login-card h1 { margin: 0 0 6px; font-size: 24px; }
    .ghost { display: none; }

    @media (max-width: 980px) {
      .shell { display: block; }
      .sidebar { width: auto; flex: none; border-right: 0; border-bottom: 1px solid var(--line); }
      .nav-scroll { display: flex; gap: 6px; overflow: auto; }
      .nav-label { display: none; }
      .nav-btn { white-space: nowrap; }
      .sidebar-foot { display: none; }
      .main { padding: 18px 14px 40px; }
      .stats, .row { grid-template-columns: 1fr 1fr; }
      .stat { border-right: 0; border-bottom: 1px solid var(--line); }
    }
    @media (max-width: 640px) {
      .stats, .row { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; }
    }
  </style>
</head>
<body>
<div id="login-screen" class="login-wrap">
  <section class="login-card">
    <h1>控制台登录</h1>
    <form onsubmit="login(); return false;">
    <div class="field">
      <label for="login-user">账号</label>
      <input id="login-user" value="admin" autocomplete="username">
    </div>
    <div class="field">
      <label for="token">密码</label>
      <input id="token" type="password" autocomplete="current-password">
    </div>
    <div class="btns"><button class="btn primary" type="submit">登录</button></div>
    <p id="login-msg" class="bad flash"></p>
    </form>
  </section>
</div>

<div id="app" class="shell ghost">
  <aside class="sidebar">
    <div class="brand">
      <b>镜像加速站</b>
      <span>控制台</span>
    </div>
    <div class="nav-label">概览</div>
    <div class="nav-scroll">
      <button class="nav-btn active" data-page="overview" type="button" onclick="showPage('overview')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        运行概览
      </button>
      <span class="nav-label">配置</span>
      <button class="nav-btn" data-page="deploy" type="button" onclick="showPage('deploy')">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        部署参数
      </button>
      <span class="nav-label">运维</span>
      <button class="nav-btn" data-page="result" type="button" onclick="showPage('result')">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
        操作结果
      </button>
      <button class="nav-btn" data-page="status" type="button" onclick="showPage('status')">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>
        容器状态
      </button>
      <button class="nav-btn" data-page="logs" type="button" onclick="showPage('logs')">
        <svg viewBox="0 0 24 24"><path d="M6 4h9l5 5v11H6z"/><path d="M15 4v5h5"/></svg>
        服务日志
      </button>
      <span class="nav-label">系统</span>
      <button class="nav-btn" data-page="settings" type="button" onclick="showPage('settings')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.7 1 1.1 1.7 1.1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        系统设置
      </button>
    </div>
    <div class="sidebar-foot" id="app-version">v1.1.9</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="page-title">运行概览</h1>
      </div>
      <div class="who">
        <span id="who">admin</span>
        <button class="btn" type="button" onclick="logout()">退出</button>
      </div>
    </div>
    <div id="toast" class="toast"></div>

    <section class="page active" id="page-overview">
      <div class="stats">
        <div class="stat"><b>加速站</b><strong id="m-site">—</strong></div>
        <div class="stat"><b>证书</b><strong id="m-cert">—</strong></div>
        <div class="stat"><b>控制台</b><strong id="m-panel">—</strong></div>
        <div class="stat"><b>接入</b><strong id="m-edge">—</strong></div>
      </div>
      <section class="card">
        <h2>快捷操作</h2>
        <div class="btns">
          <button class="btn" type="button" onclick="refreshOverview()">刷新状态</button>
          <button class="btn" type="button" id="btn-open-site">打开加速站</button>
          <button class="btn" type="button" onclick="copyMirror()">复制加速地址</button>
        </div>
      </section>
    </section>

    <section class="page" id="page-deploy">
      <section class="card">
        <h2>部署参数</h2>
        <div class="row">
          <div class="field">
            <label for="DOMAIN">主域名</label>
            <input id="DOMAIN" placeholder="example.com" autocomplete="off">
          </div>
          <div class="field">
            <label for="SITE_ADDRESS">加速站主机名</label>
            <input id="SITE_ADDRESS" placeholder="docker.example.com" autocomplete="off">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="PANEL_ADDRESS">控制台域名（可选）</label>
            <input id="PANEL_ADDRESS" placeholder="panel.example.com" autocomplete="off">
          </div>
          <div class="field">
            <label for="ACME_EMAIL">证书邮箱</label>
            <input id="ACME_EMAIL" placeholder="admin@example.com" autocomplete="off">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="EDGE_PREFERENCE">边缘接入</label>
            <select id="EDGE_PREFERENCE">
              <option value="auto">自动</option>
              <option value="behind-nginx">Nginx</option>
              <option value="behind-caddy">Caddy</option>
              <option value="direct">直连</option>
            </select>
          </div>
          <div class="field">
            <label for="DOCKERHUB_USERNAME">Docker Hub 用户名</label>
            <input id="DOCKERHUB_USERNAME" autocomplete="off">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="DOCKERHUB_PASSWORD">Docker Hub Token</label>
            <input id="DOCKERHUB_PASSWORD" type="password" placeholder="已保存则留空不改" autocomplete="off">
          </div>
          <div class="field">
            <label for="HTTP_PROXY">HTTP 代理（一般不用）</label>
            <input id="HTTP_PROXY" placeholder="留空" autocomplete="off">
          </div>
        </div>
        <input id="HTTPS_PROXY" type="hidden">
        <input id="HTTP_ONLY" type="hidden" value="true">
        <label class="check"><input id="skip_dns" type="checkbox"> 跳过 DNS 检查</label>
        <div class="btns">
          <button class="btn primary" id="btn-deploy" type="button" onclick="deploy()">保存并部署</button>
          <button class="btn" type="button" onclick="saveOnly()">只保存</button>
          <button class="btn" type="button" onclick="checkDns()">检查 DNS</button>
          <button class="btn" type="button" onclick="health()">健康检查</button>
          <button class="btn" type="button" onclick="clientCfg()">国内怎么用</button>
          <button class="btn danger" type="button" onclick="restart()">重启服务</button>
        </div>
        <p id="flash" class="flash"></p>
      </section>
    </section>

    <section class="page" id="page-settings">
      <section class="card">
        <h2>账号密码</h2>
        <div class="row">
          <div class="field">
            <label for="new-username">账号</label>
            <input id="new-username" autocomplete="off">
          </div>
          <div class="field">
            <label for="current-password">当前密码</label>
            <input id="current-password" type="password" autocomplete="off">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="new-password">新密码</label>
            <input id="new-password" type="password" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="new-password2">再输一次新密码</label>
            <input id="new-password2" type="password" autocomplete="new-password">
          </div>
        </div>
        <div class="btns">
          <button class="btn primary" type="button" onclick="changeAccount()">保存账号密码</button>
        </div>
      </section>
      <section class="card">
        <h2>GitHub 代理</h2>
        <label class="check"><input id="GITHUB_PROXY_ENABLED" type="checkbox"> 开启</label>
        <div class="row">
          <div class="field">
            <label for="GITHUB_PROXY_PORT">端口</label>
            <input id="GITHUB_PROXY_PORT" value="3128" autocomplete="off">
          </div>
          <div class="field">
            <label for="GITHUB_PROXY_ALLOW">允许的国内 IP</label>
            <input id="GITHUB_PROXY_ALLOW" placeholder="1.2.3.4 5.6.7.8" autocomplete="off">
          </div>
        </div>
        <pre id="github-proxy-snippet">export http_proxy=http://美国机IP:3128
export https_proxy=http://美国机IP:3128
export no_proxy=localhost,127.0.0.1</pre>
        <div class="btns" style="margin-top:12px">
          <button class="btn primary" type="button" onclick="saveGithubProxy()">保存并应用</button>
          <button class="btn" type="button" onclick="copyGithubProxy()">复制命令</button>
        </div>
      </section>
      <section class="card">
        <h2>维护</h2>
        <div class="btns">
          <button class="btn" type="button" onclick="runUpgrade()">升级</button>
          <button class="btn" type="button" onclick="runUninstall(true)">停服务留数据</button>
          <button class="btn danger" type="button" onclick="runUninstall(false)">卸载</button>
        </div>
      </section>
    </section>

    <section class="page" id="page-result">
      <section class="card" id="result-card">
        <h2>操作结果</h2>
        <pre id="job">还没有操作。</pre>
      </section>
    </section>

    <section class="page" id="page-status">
      <section class="card">
        <h2>容器状态</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>服务</th><th>状态</th><th>镜像</th><th>端口</th></tr>
            </thead>
            <tbody id="status-rows">
              <tr><td colspan="4">尚未加载</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>

    <section class="page" id="page-logs">
      <section class="card">
        <h2>服务日志</h2>
        <div class="btns" style="margin-bottom:12px">
          <button class="btn" type="button" onclick="logs('caddy')">内部路由</button>
          <button class="btn" type="button" onclick="logs('edge')">边缘证书</button>
          <button class="btn" type="button" onclick="logs('registry-dockerhub')">dockerhub</button>
          <button class="btn" type="button" onclick="logs('github-proxy')">github-proxy</button>
        </div>
        <pre id="logs">(空)</pre>
      </section>
    </section>
  </main>
</div>

<script>
let TOKEN = localStorage.getItem("mirror_panel_token") || "";
let USERNAME = localStorage.getItem("mirror_panel_user") || "admin";
const $ = (id) => document.getElementById(id);
const TITLES = {
  overview: "运行概览",
  deploy: "部署参数",
  settings: "系统设置",
  result: "操作结果",
  status: "容器状态",
  logs: "服务日志"
};

function showPage(name) {
  document.querySelectorAll(".page").forEach((el) => el.classList.toggle("active", el.id === "page-" + name));
  document.querySelectorAll(".nav-btn").forEach((el) => el.classList.toggle("active", el.dataset.page === name));
  $("page-title").textContent = TITLES[name] || "控制台";
}

function toast(text, kind) {
  const el = $("toast");
  if (!el) return;
  el.textContent = text || "";
  el.className = "toast show" + (kind === "bad" ? " bad" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = "toast"; }, 3200);
}

function showResult(text, kind, stay) {
  const el = $("job");
  if (el) el.textContent = text || "(空)";
  const flash = $("flash");
  const first = (text || "").split("\n").filter(Boolean)[0] || "已更新结果";
  const bad = kind === "bad" || /失败|错误|ERROR|FAIL|not found/.test(first);
  if (flash) {
    flash.textContent = first;
    flash.className = "flash " + (bad ? "bad" : "ok");
  }
  toast(first, bad ? "bad" : "ok");
  if (!stay) showPage("result");
}

async function api(path, opt={}) {
  const headers = Object.assign({"Authorization": "Bearer " + TOKEN}, opt.headers || {});
  let res;
  try { res = await fetch(path, Object.assign({}, opt, {headers})); }
  catch (e) { throw new Error("请求没发出去：" + e.message); }
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = {raw: text, status: res.status}; }
  if (res.status === 401) throw new Error(data.error || "密码错误或未登录");
  if (!res.ok && data.error) throw new Error(data.error);
  if (res.status === 404) throw new Error("控制台还是旧进程，请先跑升级命令");
  return data;
}

async function login() {
  const username = $("login-user").value.trim() || "admin";
  const password = $("token").value.trim();
  $("login-msg").textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username, password})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "登录失败");
    TOKEN = data.token;
    USERNAME = data.username || username;
    localStorage.setItem("mirror_panel_token", TOKEN);
    localStorage.setItem("mirror_panel_user", USERNAME);
    boot();
  } catch (e) {
    $("login-msg").textContent = e.message;
  }
}
function logout() {
  TOKEN = "";
  localStorage.removeItem("mirror_panel_token");
  localStorage.removeItem("mirror_panel_user");
  location.reload();
}

async function boot() {
  try {
    const cfg = await api("/api/config");
    $("login-screen").classList.add("ghost");
    $("app").classList.remove("ghost");
    USERNAME = cfg.PANEL_USERNAME || USERNAME;
    $("who").textContent = USERNAME;
    $("new-username").value = USERNAME;
    $("login-user").value = USERNAME;
    for (const k of ["DOMAIN","SITE_ADDRESS","PANEL_ADDRESS","ACME_EMAIL","DOCKERHUB_USERNAME","HTTP_PROXY","EDGE_PREFERENCE"]) {
      if (cfg[k] !== undefined && $(k)) $(k).value = cfg[k];
    }
    $("DOCKERHUB_PASSWORD").placeholder = cfg.DOCKERHUB_PASSWORD_SET ? "已保存，留空不改" : "建议填写 Access Token";
    if (cfg.VERSION && $("app-version")) $("app-version").textContent = cfg.VERSION;
    if ($("GITHUB_PROXY_ENABLED")) {
      $("GITHUB_PROXY_ENABLED").checked = /^(1|true|yes|on)$/i.test(cfg.GITHUB_PROXY_ENABLED || "");
    }
    if ($("GITHUB_PROXY_PORT") && cfg.GITHUB_PROXY_PORT) $("GITHUB_PROXY_PORT").value = cfg.GITHUB_PROXY_PORT;
    if ($("GITHUB_PROXY_ALLOW") && cfg.GITHUB_PROXY_ALLOW !== undefined) {
      $("GITHUB_PROXY_ALLOW").value = String(cfg.GITHUB_PROXY_ALLOW || "").replace(/[,;]+/g, " ").trim();
    }
    renderGithubSnippet();
    refreshOverview();
    pollJob();
  } catch (e) {
    $("login-msg").textContent = e.message;
    $("login-screen").classList.remove("ghost");
    $("app").classList.add("ghost");
  }
}

function renderGithubSnippet() {
  const el = $("github-proxy-snippet");
  if (!el) return;
  const port = ($("GITHUB_PROXY_PORT") && $("GITHUB_PROXY_PORT").value.trim()) || "3128";
  const site = ($("SITE_ADDRESS") && $("SITE_ADDRESS").value.trim()) || "";
  const noProxy = site ? "localhost,127.0.0.1," + site : "localhost,127.0.0.1";
  el.textContent =
    "export http_proxy=http://美国机IP:" + port + "\n" +
    "export https_proxy=http://美国机IP:" + port + "\n" +
    "export no_proxy=" + noProxy;
}

function formPayload() {
  const data = {
    DOMAIN: $("DOMAIN").value.trim(),
    SITE_ADDRESS: $("SITE_ADDRESS").value.trim(),
    PANEL_ADDRESS: $("PANEL_ADDRESS") ? $("PANEL_ADDRESS").value.trim() : "",
    ACME_EMAIL: $("ACME_EMAIL").value.trim(),
    EDGE_PREFERENCE: $("EDGE_PREFERENCE") ? $("EDGE_PREFERENCE").value : "auto",
    HTTP_ONLY: "true",
    DOCKERHUB_USERNAME: $("DOCKERHUB_USERNAME").value.trim(),
    HTTP_PROXY: $("HTTP_PROXY").value.trim(),
    HTTPS_PROXY: $("HTTP_PROXY").value.trim(),
    GITHUB_PROXY_ENABLED: ($("GITHUB_PROXY_ENABLED") && $("GITHUB_PROXY_ENABLED").checked) ? "true" : "false",
    GITHUB_PROXY_PORT: $("GITHUB_PROXY_PORT") ? $("GITHUB_PROXY_PORT").value.trim() : "3128",
    GITHUB_PROXY_ALLOW: $("GITHUB_PROXY_ALLOW") ? $("GITHUB_PROXY_ALLOW").value.trim() : "",
    skip_dns: $("skip_dns").checked,
  };
  const pwd = $("DOCKERHUB_PASSWORD").value.trim();
  if (pwd) data.DOCKERHUB_PASSWORD = pwd;
  return data;
}

function parseKv(text) {
  const out = {};
  (text || "").split("\n").forEach((line) => {
    const i = line.indexOf("=");
    if (i > 0) out[line.slice(0,i)] = line.slice(i+1);
  });
  return out;
}

function renderStatus(rows, fallback) {
  const box = $("status-rows");
  if (!box) return;
  if (!rows || !rows.length) {
    box.innerHTML = "<tr><td colspan=\"4\">" + (fallback || "暂无容器") + "</td></tr>";
    return;
  }
  box.innerHTML = rows.map((row) => {
    const state = String(row.state || row.status || "").toLowerCase();
    const up = state.includes("running") || state === "up";
    return "<tr><td>" + (row.service || row.name || "-") +
      "</td><td><span class=\"dot " + (up ? "up" : "down") + "\"></span>" + (row.status || row.state || "-") +
      "</td><td>" + (row.image || "-") +
      "</td><td>" + (row.ports || "-") + "</td></tr>";
  }).join("");
}

async function refreshOverview() {
  try {
    const st = await api("/api/status");
    renderStatus(st.rows, st.output || st.error || "暂无容器");
  } catch (e) {
    renderStatus([], "读取容器失败：" + e.message);
  }
  try {
    const r = await api("/api/cert");
    const kv = parseKv(r.output || "");
    $("m-site").textContent = kv.site || $("SITE_ADDRESS").value || "未设置";
    const edge = kv.edge_mode || "未探测";
    const edgeText = ({
      "behind-nginx": "Nginx",
      "behind-caddy": "Caddy",
      "direct": "直连",
      "behind-unknown": "其它占用"
    })[edge] || edge;
    $("m-edge").textContent = edgeText;
    const panelHost = kv.panel || ($("PANEL_ADDRESS") && $("PANEL_ADDRESS").value) || "";
    if (kv.panel_https === "ok") {
      $("m-panel").textContent = panelHost;
      $("m-panel").className = "ok";
    } else if (panelHost) {
      $("m-panel").textContent = panelHost;
    } else {
      $("m-panel").textContent = "IP:端口";
    }
    let certText = "未探测";
    if (kv.cert_ok === "yes") {
      certText = "已生效";
      $("m-cert").className = "ok";
    } else if (kv.public_https === "ok") {
      certText = "可访问";
      $("m-cert").className = "ok";
    } else if (kv.public_https === "redirect") {
      certText = "还在跳转";
      $("m-cert").className = "warn";
    } else {
      certText = "未生效";
      $("m-cert").className = "bad";
    }
    if (kv.cert_not_after) {
      const shortDate = String(kv.cert_not_after).replace(/\s+GMT.*/i, "").replace(/\s+\d{2}:\d{2}:\d{2}.*/, "");
      certText += " · " + shortDate;
    }
    $("m-cert").textContent = certText;
    const site = kv.site || $("SITE_ADDRESS").value;
    const open = $("btn-open-site");
    open.onclick = () => { if (site) window.open("https://" + site + "/", "_blank"); };
  } catch (e) {
    $("m-cert").textContent = "读失败";
  }
}

function copyMirror() {
  const site = $("SITE_ADDRESS").value.trim();
  if (!site) { showResult("先填加速站主机名", "bad", true); return; }
  const url = "https://" + site;
  navigator.clipboard.writeText(url).then(() => showResult("已复制 " + url, "ok", true))
    .catch(() => showResult(url, "ok", true));
}

async function saveOnly() {
  try {
    const r = await api("/api/config", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(formPayload())});
    showResult(r.ok ? "已保存，还没有部署。" : (r.error || "保存失败"), r.ok ? "ok" : "bad", true);
  } catch (e) { showResult("保存失败：" + e.message, "bad", true); }
}

async function saveGithubProxy() {
  renderGithubSnippet();
  const payload = {
    GITHUB_PROXY_ENABLED: ($("GITHUB_PROXY_ENABLED") && $("GITHUB_PROXY_ENABLED").checked) ? "true" : "false",
    GITHUB_PROXY_PORT: $("GITHUB_PROXY_PORT") ? $("GITHUB_PROXY_PORT").value.trim() : "3128",
    GITHUB_PROXY_ALLOW: $("GITHUB_PROXY_ALLOW") ? $("GITHUB_PROXY_ALLOW").value.trim() : "",
  };
  if (payload.GITHUB_PROXY_ENABLED === "true" && !payload.GITHUB_PROXY_ALLOW) {
    showResult("开启代理必须填写允许的国内 IP", "bad", true);
    return;
  }
  try {
    const r = await api("/api/github-proxy", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    showResult(r.message || "已开始应用 GitHub 代理", "ok", true);
    pollJob();
  } catch (e) {
    showResult("应用代理失败：" + e.message, "bad", true);
  }
}

function copyGithubProxy() {
  renderGithubSnippet();
  const text = $("github-proxy-snippet") ? $("github-proxy-snippet").textContent : "";
  navigator.clipboard.writeText(text).then(() => showResult("已复制代理命令", "ok", true))
    .catch(() => showResult(text, "ok", true));
}

async function changeAccount() {
  const username = $("new-username").value.trim();
  const current = $("current-password").value;
  const password = $("new-password").value;
  const again = $("new-password2").value;
  if (!username) { showResult("账号不能为空", "bad"); return; }
  if (!current) { showResult("请先填当前密码", "bad"); return; }
  if (!password) { showResult("新密码不能为空", "bad"); return; }
  if (password !== again) { showResult("两次新密码不一致", "bad"); return; }
  try {
    const r = await api("/api/account", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({username, current_password: current, password})
    });
    TOKEN = r.token;
    USERNAME = r.username || username;
    localStorage.setItem("mirror_panel_token", TOKEN);
    localStorage.setItem("mirror_panel_user", USERNAME);
    $("who").textContent = USERNAME;
    $("current-password").value = "";
    $("new-password").value = "";
    $("new-password2").value = "";
    showResult("账号密码已更新。", "ok", true);
  } catch (e) {
    showResult("改账号失败：" + e.message, "bad", true);
  }
}

async function deploy() {
  const btn = $("btn-deploy");
  if (btn) btn.disabled = true;
  showResult("正在提交部署任务…", "ok", true);
  try {
    const r = await api("/api/deploy", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(formPayload())});
    if (r.error) { showResult("部署没有开始：" + r.error, "bad", true); return; }
    showResult("任务已提交。", "ok", true);
    pollJob();
  } catch (e) { showResult("部署失败：" + e.message, "bad", true); }
  finally { if (btn) btn.disabled = false; }
}

async function pollJob() {
  try {
    const r = await api("/api/job");
    if (r.log) $("job").textContent = r.log;
    if (r.running) setTimeout(pollJob, 1500);
    else {
      const first = ((r.log || "").split("\n").filter(Boolean).slice(-1)[0]) || "任务结束";
      toast(first, r.ok === false ? "bad" : "ok");
      refreshOverview();
    }
  } catch (e) { showResult("读取任务日志失败：" + e.message, "bad", true); }
}

async function checkDns() {
  try {
    await saveOnly();
    showResult("正在检查 DNS…", "ok", true);
    const r = await api("/api/dns");
    showResult(r.output || r.error || "DNS 检查无输出", r.ok ? "ok" : "bad", true);
  } catch (e) { showResult("DNS 检查失败：" + e.message, "bad", true); }
}
async function health() {
  try {
    showResult("正在做健康检查…", "ok", true);
    const r = await api("/api/health");
    showResult(r.output || r.error || "健康检查无输出", r.ok ? "ok" : "bad", true);
    refreshOverview();
  } catch (e) { showResult("健康检查失败：" + e.message, "bad", true); }
}
async function clientCfg() {
  try {
    const r = await api("/api/client");
    showResult(r.output || r.error || "无输出", "ok", true);
  } catch (e) { showResult("读取客户端配置失败：" + e.message, "bad", true); }
}
async function logs(svc) {
  try {
    const r = await api("/api/logs?service=" + encodeURIComponent(svc || "caddy"));
    $("logs").textContent = r.output || r.error || "(空)";
    showPage("logs");
  } catch (e) { $("logs").textContent = "读日志失败：" + e.message; }
}
async function restart() {
  if (!confirm("确定重启加速站容器？")) return;
  try {
    const r = await api("/api/restart", {method:"POST"});
    showResult(r.output || r.error || "已发送重启", "ok", true);
    refreshOverview();
  } catch (e) { showResult("重启失败：" + e.message, "bad", true); }
}

async function runUpgrade() {
  if (!confirm("确定升级到最新版本？控制台可能会短暂重启。")) return;
  try {
    const r = await api("/api/upgrade", {method:"POST", headers:{"Content-Type":"application/json"}, body: "{}"});
    showResult(r.message || "已开始升级", "ok", true);
    pollJob();
  } catch (e) { showResult("升级失败：" + e.message, "bad", true); }
}

async function runUninstall(keep) {
  const msg = keep ? "只停服务、保留缓存和配置？" : "确定卸载？会删除安装目录，不卸 Docker。";
  if (!confirm(msg)) return;
  try {
    const r = await api("/api/uninstall", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({keep_data: !!keep})
    });
    showResult(r.message || "已开始卸载", "ok", true);
    pollJob();
  } catch (e) { showResult("卸载失败：" + e.message, "bad", true); }
}

if (USERNAME) $("login-user").value = USERNAME;
if (TOKEN) boot();
</script>
</body>
</html>
