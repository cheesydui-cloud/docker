<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>镜像加速站控制台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f4f5;
      color: #111;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
    h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
    .sub { margin: 0 0 16px; color: #555; }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    label { display: block; margin: 10px 0 4px; color: #333; }
    input, select {
      width: 100%;
      height: 36px;
      padding: 0 8px;
      border: 1px solid #ccc;
      background: #fff;
      color: #111;
      font: inherit;
    }
    input:focus, select:focus { outline: 1px solid #111; border-color: #111; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .metric { border: 1px solid #ddd; background: #fafafa; padding: 10px; }
    .metric b { display: block; color: #666; font-weight: 500; margin-bottom: 4px; }
    .metric span { word-break: break-all; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      height: 34px;
      padding: 0 12px;
      border: 1px solid #bbb;
      background: #fff;
      color: #111;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #f0f0f0; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .primary { background: #111; color: #fff; border-color: #111; }
    .primary:hover { background: #333; }
    .danger { color: #a40000; border-color: #c9a0a0; }
    pre {
      margin: 0;
      background: #f7f7f7;
      border: 1px solid #ddd;
      padding: 10px;
      overflow: auto;
      min-height: 120px;
      white-space: pre-wrap;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .ok { color: #0a7a2f; }
    .bad { color: #b42318; }
    .warn { color: #8a5a00; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: #444; }
    .check input { width: auto; height: auto; }
    @media (max-width: 800px) { .row, .metrics { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>镜像加速站控制台</h1>
      <p class="sub">域名、证书邮箱、接入方式都在这里填。群晖填加速站主机名，不要填这个控制台地址。</p>
    </div>
    <button type="button" id="btn-logout" onclick="logout()" style="display:none">退出</button>
  </div>

  <section class="card" id="login-card">
    <h2>登录</h2>
    <p class="sub">密码在安装结束时打印，文件在安装目录 <code>panel/.secret</code></p>
    <label for="token">面板密码</label>
    <input id="token" type="password" autocomplete="current-password">
    <div class="btns"><button class="primary" type="button" onclick="login()">登录</button></div>
    <p id="login-msg" class="bad"></p>
  </section>

  <div id="app" style="display:none">
    <section class="card">
      <h2>运行状态</h2>
      <p class="sub" id="cert-hint">正在读取状态…</p>
      <div class="metrics">
        <div class="metric"><b>加速站</b><span id="m-site">—</span></div>
        <div class="metric"><b>证书</b><span id="m-cert">—</span></div>
        <div class="metric"><b>控制台</b><span id="m-panel">—</span></div>
      </div>
      <p class="sub" id="edge-hint" style="margin:10px 0 0"></p>
      <div class="btns">
        <button type="button" onclick="refreshOverview()">刷新状态</button>
        <button type="button" id="btn-open-site">打开加速站</button>
        <button type="button" onclick="copyMirror()">复制加速地址</button>
      </div>
    </section>

    <section class="card">
      <h2>部署参数</h2>
      <div class="row">
        <div>
          <label for="DOMAIN">主域名</label>
          <input id="DOMAIN" placeholder="example.com" autocomplete="off">
        </div>
        <div>
          <label for="SITE_ADDRESS">加速站主机名</label>
          <input id="SITE_ADDRESS" placeholder="docker.example.com" autocomplete="off">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="PANEL_ADDRESS">控制台域名（可选）</label>
          <input id="PANEL_ADDRESS" placeholder="panel.example.com" autocomplete="off">
        </div>
        <div>
          <label for="ACME_EMAIL">证书邮箱</label>
          <input id="ACME_EMAIL" placeholder="admin@example.com" autocomplete="off">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="EDGE_PREFERENCE">边缘接入</label>
          <select id="EDGE_PREFERENCE">
            <option value="auto">自动：按 80/443 占用选择</option>
            <option value="behind-nginx">Nginx（本机已有 Nginx / 3x-ui）</option>
            <option value="behind-caddy">Caddy（本机已有宿主机 Caddy）</option>
            <option value="direct">直连（本机 80/443 空闲，用 edge 签证书）</option>
          </select>
        </div>
        <div>
          <label for="DOCKERHUB_USERNAME">Docker Hub 用户名</label>
          <input id="DOCKERHUB_USERNAME" autocomplete="off">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="DOCKERHUB_PASSWORD">Docker Hub Token</label>
          <input id="DOCKERHUB_PASSWORD" type="password" placeholder="已保存则留空不改" autocomplete="off">
        </div>
        <div>
          <label for="HTTP_PROXY">HTTP 代理（一般不用）</label>
          <input id="HTTP_PROXY" placeholder="留空" autocomplete="off">
        </div>
      </div>
      <input id="HTTPS_PROXY" type="hidden">
      <input id="HTTP_ONLY" type="hidden" value="true">
      <label class="check"><input id="skip_dns" type="checkbox"> 跳过 DNS 检查</label>
      <div class="btns">
        <button class="primary" id="btn-deploy" type="button" onclick="deploy()">保存并部署</button>
        <button type="button" onclick="saveOnly()">只保存</button>
        <button type="button" onclick="checkDns()">检查 DNS</button>
        <button type="button" onclick="health()">健康检查</button>
        <button type="button" onclick="clientCfg()">国内怎么用</button>
        <button class="danger" type="button" onclick="restart()">重启服务</button>
      </div>
      <p id="flash" class="sub" style="margin:12px 0 0">点按钮后，结果出现在下面「操作结果」。</p>
    </section>

    <section class="card" id="result-card">
      <h2>操作结果</h2>
      <pre id="job">还没有操作。</pre>
    </section>
    <section class="card">
      <h2>容器状态</h2>
      <pre id="status">(尚未加载)</pre>
    </section>
    <section class="card">
      <h2>服务日志</h2>
      <div class="btns">
        <button type="button" onclick="logs('caddy')">内部路由</button>
        <button type="button" onclick="logs('edge')">边缘证书</button>
        <button type="button" onclick="logs('registry-dockerhub')">dockerhub</button>
      </div>
      <pre id="logs">(空)</pre>
    </section>
  </div>
</main>
<script>
let TOKEN = localStorage.getItem("mirror_panel_token") || "";
const $ = (id) => document.getElementById(id);

function showResult(text, kind) {
  const el = $("job");
  if (el) el.textContent = text || "(空)";
  const flash = $("flash");
  if (flash) {
    const first = (text || "").split("\n").filter(Boolean)[0] || "已更新结果";
    flash.textContent = first;
    flash.className = kind || (/失败|错误|ERROR|FAIL/.test(first) ? "bad" : "ok");
  }
  const card = $("result-card");
  if (card) card.scrollIntoView({behavior: "smooth", block: "start"});
}

async function api(path, opt={}) {
  const headers = Object.assign({"Authorization": "Bearer " + TOKEN}, opt.headers || {});
  let res;
  try { res = await fetch(path, Object.assign({}, opt, {headers})); }
  catch (e) { throw new Error("请求没发出去：" + e.message); }
  if (res.status === 401) throw new Error("密码错误或未登录");
  const text = await res.text();
  try { return JSON.parse(text); } catch { return {raw: text, status: res.status}; }
}

function login() {
  TOKEN = $("token").value.trim();
  localStorage.setItem("mirror_panel_token", TOKEN);
  boot();
}
function logout() {
  TOKEN = "";
  localStorage.removeItem("mirror_panel_token");
  location.reload();
}

async function boot() {
  try {
    const cfg = await api("/api/config");
    $("login-card").style.display = "none";
    $("app").style.display = "block";
    $("btn-logout").style.display = "inline-block";
    for (const k of ["DOMAIN","SITE_ADDRESS","PANEL_ADDRESS","ACME_EMAIL","DOCKERHUB_USERNAME","HTTP_PROXY","EDGE_PREFERENCE"]) {
      if (cfg[k] !== undefined && $(k)) $(k).value = cfg[k];
    }
    $("DOCKERHUB_PASSWORD").placeholder = cfg.DOCKERHUB_PASSWORD_SET ? "已保存，留空不改" : "建议填写 Access Token";
    refreshOverview();
    pollJob();
  } catch (e) {
    $("login-msg").textContent = e.message;
    $("login-card").style.display = "block";
    $("app").style.display = "none";
  }
}

function formPayload() {
  const data = {
    DOMAIN: $("DOMAIN").value.trim(),
    SITE_ADDRESS: $("SITE_ADDRESS").value.trim(),
    PANEL_ADDRESS: $("PANEL_ADDRESS") ? $("PANEL_ADDRESS").value.trim() : "",
    ACME_EMAIL: $("ACME_EMAIL").value.trim(),
    EDGE_PREFERENCE: $("EDGE_PREFERENCE") ? $("EDGE_PREFERENCE").value : "auto",
    HTTP_ONLY: "true",
    DOCKERHUB_USERNAME: $("DOCKERHUB_USERNAME").value.trim(),
    HTTP_PROXY: $("HTTP_PROXY").value.trim(),
    HTTPS_PROXY: $("HTTP_PROXY").value.trim(),
    skip_dns: $("skip_dns").checked,
  };
  const pwd = $("DOCKERHUB_PASSWORD").value.trim();
  if (pwd) data.DOCKERHUB_PASSWORD = pwd;
  return data;
}

function parseKv(text) {
  const out = {};
  (text || "").split("\n").forEach((line) => {
    const i = line.indexOf("=");
    if (i > 0) out[line.slice(0,i)] = line.slice(i+1);
  });
  return out;
}

async function refreshOverview() {
  try {
    const st = await api("/api/status");
    $("status").textContent = st.output || st.error || "(空)";
  } catch (e) {
    $("status").textContent = "读取容器失败：" + e.message;
  }
  try {
    const r = await api("/api/cert");
    const kv = parseKv(r.output || "");
    $("m-site").textContent = kv.site || $("SITE_ADDRESS").value || "未设置";
    const edge = kv.edge_mode || "未探测";
    const pref = kv.edge_preference || ($("EDGE_PREFERENCE") && $("EDGE_PREFERENCE").value) || "auto";
    const edgeText = ({
      "behind-nginx": "Nginx",
      "behind-caddy": "Caddy",
      "direct": "直连 edge",
      "behind-unknown": "80 被其它进程占用"
    })[edge] || edge;
    if ($("edge-hint")) $("edge-hint").textContent = "当前接入：" + edgeText + "（面板选择：" + pref + "）";
    const panelHost = kv.panel || ($("PANEL_ADDRESS") && $("PANEL_ADDRESS").value) || "";
    if (kv.panel_https === "ok") {
      $("m-panel").textContent = "https://" + panelHost;
      $("m-panel").className = "ok";
    } else if (panelHost) {
      $("m-panel").textContent = panelHost + "（DNS 指过来后自动签证书）";
    } else {
      $("m-panel").textContent = "未设置，使用 IP:端口";
    }
    let certText = "还没探测到";
    let hint = "";
    if (kv.cert_ok === "yes") {
      certText = "Let's Encrypt 已生效";
      hint = "加速站 https://" + (kv.site || "") + " 证书正常。控制台如果走 IP:端口，浏览器写不安全是正常的。";
      $("m-cert").className = "ok";
    } else if (kv.public_https === "ok") {
      certText = kv.cert_issuer || "已能打开 HTTPS";
      hint = "站点能打开。颁发者：" + (kv.cert_issuer || "未知");
      $("m-cert").className = "ok";
    } else if (kv.public_https === "redirect") {
      certText = "还在跳转";
      hint = "公网在 301/308。Cloudflare 必须关闭代理（灰云）。";
      $("m-cert").className = "warn";
    } else {
      certText = "未生效";
      hint = "先填加速站主机名，再点保存并部署。";
      $("m-cert").className = "bad";
    }
    if (kv.cert_not_after) certText += " · 到期 " + kv.cert_not_after;
    $("m-cert").textContent = certText;
    $("cert-hint").textContent = hint;
    const site = kv.site || $("SITE_ADDRESS").value;
    const open = $("btn-open-site");
    open.onclick = () => { if (site) window.open("https://" + site + "/", "_blank"); };
  } catch (e) {
    $("m-cert").textContent = "读证书失败";
    $("cert-hint").textContent = e.message;
  }
}

function copyMirror() {
  const site = $("SITE_ADDRESS").value.trim();
  if (!site) { showResult("先填加速站主机名", "bad"); return; }
  const url = "https://" + site;
  navigator.clipboard.writeText(url).then(() => showResult("已复制 " + url, "ok"))
    .catch(() => showResult(url, "ok"));
}

async function saveOnly() {
  try {
    const r = await api("/api/config", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(formPayload())});
    showResult(r.ok ? "已保存，还没有部署。" : (r.error || "保存失败"), r.ok ? "ok" : "bad");
  } catch (e) { showResult("保存失败：" + e.message, "bad"); }
}

async function deploy() {
  const btn = $("btn-deploy");
  if (btn) btn.disabled = true;
  showResult("正在提交部署任务…", "ok");
  try {
    const r = await api("/api/deploy", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(formPayload())});
    if (r.error) { showResult("部署没有开始：" + r.error, "bad"); return; }
    showResult("任务已提交。下面会持续刷新日志。", "ok");
    pollJob();
  } catch (e) { showResult("部署失败：" + e.message, "bad"); }
  finally { if (btn) btn.disabled = false; }
}

async function pollJob() {
  try {
    const r = await api("/api/job");
    if (r.log) showResult(r.log, r.ok === false ? "bad" : "ok");
    if (r.running) setTimeout(pollJob, 1500);
    else refreshOverview();
  } catch (e) { showResult("读取任务日志失败：" + e.message, "bad"); }
}

async function checkDns() {
  try {
    await saveOnly();
    showResult("正在检查 DNS…", "ok");
    const r = await api("/api/dns");
    showResult(r.output || r.error || "DNS 检查无输出", r.ok ? "ok" : "bad");
  } catch (e) { showResult("DNS 检查失败：" + e.message, "bad"); }
}
async function health() {
  try {
    showResult("正在做健康检查…", "ok");
    const r = await api("/api/health");
    showResult(r.output || r.error || "健康检查无输出", r.ok ? "ok" : "bad");
    refreshOverview();
  } catch (e) { showResult("健康检查失败：" + e.message, "bad"); }
}
async function clientCfg() {
  try {
    const r = await api("/api/client");
    showResult(r.output || r.error || "无输出", "ok");
  } catch (e) { showResult("读取客户端配置失败：" + e.message, "bad"); }
}
async function logs(svc) {
  try {
    const r = await api("/api/logs?service=" + encodeURIComponent(svc || "caddy"));
    $("logs").textContent = r.output || r.error || "(空)";
  } catch (e) { $("logs").textContent = "读日志失败：" + e.message; }
}
async function restart() {
  if (!confirm("确定重启加速站容器？")) return;
  try {
    const r = await api("/api/restart", {method:"POST"});
    showResult(r.output || r.error || "已发送重启", "ok");
    refreshOverview();
  } catch (e) { showResult("重启失败：" + e.message, "bad"); }
}

if (TOKEN) boot();
</script>
</body>
</html>
