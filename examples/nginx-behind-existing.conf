# 占用 80/443 的 Nginx / 3x-ui 由 adapt-host 自动写
# /etc/nginx/conf.d/docker-mirror.conf 。这是等价手写版本。
#
# 注意：
# 1. HTTP 不要 301 到 HTTPS。内部路由是纯 HTTP，再跳会环。
# 2. 其它站点不能再写同一个 server_name。

server {
    listen 80;
    listen [::]:80;
    server_name docker.nodelink.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/docker-mirror-acme;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:5080;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docker.nodelink.uk;

    ssl_certificate     /etc/letsencrypt/live/docker.nodelink.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docker.nodelink.uk/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:5080;
    }
}
