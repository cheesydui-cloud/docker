name: docker-mirror

x-registry: &registry
  image: registry:2.8.3
  restart: unless-stopped
  environment: &registry-env
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,caddy,edge}
  volumes:
    - ./registry/config.yml:/etc/docker/registry/config.yml:ro

services:
  # 内部路由器：永远只听 HTTP。对外证书由 edge 或宿主机 Nginx/Caddy 处理。
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - registry-dockerhub
      - registry-ghcr
      - registry-gcr
      - registry-quay
      - registry-k8s
      - registry-nvcr
      - registry-mcr
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-5080}:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/usr/share/caddy:ro

  # 仅当 80/443 空闲时启动（.env 里 COMPOSE_PROFILES=direct）
  edge:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles: ["direct"]
    depends_on:
      - caddy
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - edge_data:/data
      - edge_config:/config

  registry-dockerhub:
    <<: *registry
    environment:
      <<: *registry-env
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_PROXY_USERNAME: ${DOCKERHUB_USERNAME:-}
      REGISTRY_PROXY_PASSWORD: ${DOCKERHUB_PASSWORD:-}
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - ./data/dockerhub:/var/lib/registry

  registry-ghcr:
    <<: *registry
    environment:
      <<: *registry-env
      REGISTRY_PROXY_REMOTEURL: https://ghcr.io
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - ./data/ghcr:/var/lib/registry

  registry-gcr:
    <<: *registry
    environment:
      <<: *registry-env
      REGISTRY_PROXY_REMOTEURL: https://gcr.io
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - ./data/gcr:/var/lib/registry

  registry-quay:
    <<: *registry
    environment:
      <<: *registry-env
      REGISTRY_PROXY_REMOTEURL: https://quay.io
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - ./data/quay:/var/lib/registry

  registry-k8s:
    <<: *registry
    environment:
      <<: *registry-env
      REGISTRY_PROXY_REMOTEURL: https://registry.k8s.io
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - ./data/k8s:/var/lib/registry

  registry-nvcr:
    <<: *registry
    environment:
      <<: *registry-env
      REGISTRY_PROXY_REMOTEURL: https://nvcr.io
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - ./data/nvcr:/var/lib/registry

  registry-mcr:
    <<: *registry
    environment:
      <<: *registry-env
      REGISTRY_PROXY_REMOTEURL: https://mcr.microsoft.com
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - ./data/mcr:/var/lib/registry

  # 国内机 GitHub 正向代理。独立 profile，不占 80/443，也不改 Docker 加速站。
  github-proxy:
    image: kalaksi/tinyproxy:latest
    restart: unless-stopped
    profiles: ["github-proxy"]
    ports:
      - "0.0.0.0:${GITHUB_PROXY_PORT:-3128}:8888"
    environment:
      LISTEN_PORT: "8888"
      ALLOWED_NETWORKS: "${GITHUB_PROXY_ALLOW:-127.0.0.1}"
      TIMEOUT: "600"
      MAXCLIENTS: "200"
      LOG_LEVEL: "Info"

volumes:
  edge_data:
  edge_config:
